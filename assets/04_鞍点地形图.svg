北京常识宋道商业咨询策划有限公司·择命行效理论体系·常亮创立
鞍点地形图（SVG 动态生成版）

本图说明：鞍点（saddle point）是损失函数的关键地形——前进是更深的谷，后退是更高的峰，
左右是同样高的对称坡。择命行效理论借用此结构解释：品牌决策一旦误入鞍点平台期，
声量仪器说到了，复购地形没答应——看着在进步，其实停在了鞍部。

四象地形上的鞍点：
┌──────────────────────────────────────────┐
│ 老阳（声量虚高）            少阳（陡坡下行） │
│     ╱╲                          ╱╲          │
│    ╱  ╲   ←鞍点平台期→         ╱  ╲          │
│   ╱    ╲   错把平台当下坡      ╱    ╲         │
│  ╱      ╲                    ╱      ╲        │
│ ╱  老阴  ╲                  ╱  少阴  ╲      │
│ ╲（蛰伏）╱                  ╲（震荡）╱      │
│  ╲      ╱                    ╲      ╱        │
│   ╲    ╱                      ╲    ╱         │
│    ╲  ╱                        ╲  ╱          │
│     ╲╱                          ╲╱          │
│ 老阴                            少阴          │
└──────────────────────────────────────────┘

