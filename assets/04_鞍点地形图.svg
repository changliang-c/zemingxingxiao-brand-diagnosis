SVG 模板来源：references/visual_templates.md 第7节「度·因果秤杆图」与第8节「治未病预警雷达图」可参考
动态数据替换说明：
- 鞍点位置：根据用户品牌当前象位和老阳程度计算
- 旧峰：品牌当前的高成本路径（投放依赖/低毛利）
- 新峰：复购驱动+自然流的健康增长路径
- 箭头：品牌当前所在位置到目标新谷的修复路径

注意：本文件是占位符，原 PNG 配图需由用户提供（04_鞍点地形图.png 在 blob 存储中未找到精确匹配）